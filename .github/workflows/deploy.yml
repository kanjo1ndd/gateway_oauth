name: Build & Deploy to GKE

on:
  push:
    branches: [ "master" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  CLUSTER_NAME: ${{ secrets.GKE_CLUSTER }}
  CLUSTER_ZONE: ${{ secrets.GKE_ZONE }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== GCP AUTH =====
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker -q

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $CLUSTER_NAME \
            --zone $CLUSTER_ZONE \
            --project $PROJECT_ID

      # ===== BACKEND =====
      - name: Build Java backend
        run: mvn clean package -DskipTests

      - name: Build & Push backend image
        run: |
          docker build -t gcr.io/$PROJECT_ID/java-backend:latest .
          docker push gcr.io/$PROJECT_ID/java-backend:latest

      # ===== GATEWAY =====
      - name: Build & Push gateway image
        run: |
          docker build -t gcr.io/$PROJECT_ID/gateway:latest ./gateway
          docker push gcr.io/$PROJECT_ID/gateway:latest

      # ===== FRONTEND =====
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build & Push frontend image
        run: |
          docker build -t gcr.io/$PROJECT_ID/frontend:latest ./frontend
          docker push gcr.io/$PROJECT_ID/frontend:latest

      # ===== DEPLOY =====
      - name: Apply k8s manifests
        run: |
          kubectl apply -f k8s/

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment gateway
          kubectl rollout restart deployment java-backend
          kubectl rollout restart deployment frontend