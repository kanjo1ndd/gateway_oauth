server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: gateway

  cloud:
    gateway:
      default-filters:
        - SaveSession
      routes:

        - id: frontend
          uri: http://frontend-service:80
          predicates:
            - Path=/
            - Path=/index.html

        - id: frontend-assets
          uri: http://frontend-service:80
          predicates:
            - Path=/assets/**
            - Path=/static/**

        - id: java-backend
          uri: http://java-backend:8081
          predicates:
            - Path=/api/**

        - id: email-service
          uri: http://email-service:8082
          predicates:
            - Path=/email/**

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub